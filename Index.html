<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Revizio 2.0</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revizio">
<style>
  :root {
    --accent: #378add;
    --accent-light: #122238;
    --ink: #f0f2f5;
    --ink-soft: #a0a6b0;
    --ink-faint: #6c727e;
    --bg: #000000;
    --surface: #111315;
    --border: #22252a;
    --good: #24a17f;
    --good-bg: #0b211a;
    --warn: #dd902d;
    --warn-bg: #24190b;
    --danger: #e55353;
    --shadow: 0 4px 12px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  #root { min-height: 100vh; padding: 16px 16px 60px; max-width: 480px; margin: 0 auto; }
  button, input, select { font-family: inherit; outline: none; }
  
  .card { background: var(--surface); border-radius: 18px; padding: 18px; border: 1px solid var(--border); margin-bottom: 14px; box-shadow: var(--shadow); }
  
  .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .btn-rate {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px;
    box-shadow: var(--shadow); transition: transform 0.1s ease; cursor: pointer;
  }
  .btn-rate:active { transform: scale(0.93); }
  .btn-rate.just-added { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-rate:disabled { opacity: 0.3; cursor: not-allowed; transform: none !important; }
  
  .progress-bg { height: 10px; background: #1a1d21; border-radius: 6px; overflow: hidden; }
  .progress-bar { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  
  .btn-main { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700; width: 100%; cursor: pointer; }
  .btn-good { background: var(--good); color: #fff; border: none; border-radius: 14px; padding: 16px; font-size: 16px; font-weight: 700; width: 100%; cursor: pointer; }
  .btn-danger { background: var(--danger); color: #fff; border: none; border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 600; width: 100%; cursor: pointer; }
  
  .input-field { background: #1a1d21; border: 1px solid var(--border); border-radius: 12px; padding: 12px; color: #fff; font-size: 16px; width: 100%; margin-bottom: 12px; text-align: center; }
  
  .pin-dots { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
  .pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); background: transparent; }
  .pin-dot.active { background: var(--accent); border-color: var(--accent); }

  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto; }
  .keypad-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 64px; height: 64px; font-size: 22px; font-weight: 700; color: #fff; margin: 0 auto; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .keypad-btn:active { background: var(--border); }
</style>
</head>
<body>
<div id="root"></div>

<script>
const VAT_RATE = 0.21;
const GROSS_RATES = [190, 290, 310];
const RATES = GROSS_RATES.map(r => Math.round((r / (1 + VAT_RATE)) * 100) / 100);
const DAILY_TARGET = 1500;
const BONUS_RATE = 0.31;
const DB_KEY = 'revizio_v2_db';

let db = loadDB();
let activeUser = null;
let pinInput = "";
let isCreatingProfile = false;
let setupStep = 1;
let tempName = "";
let justAddedRate = null;

function loadDB() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { users: {} };
}

function saveDB() {
  try { localStorage.setItem(DB_KEY, JSON.stringify(db)); } catch (e) {}
}

function triggerHaptic() {
  if (navigator.vibrate) navigator.vibrate(20);
}

function todayKey(d = new Date()) { return d.toISOString().slice(0, 10); }
function monthKey(d = new Date()) { return d.toISOString().slice(0, 7); }

function fmtRON(n) {
  return new Intl.NumberFormat('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n) + ' lei';
}

function grossOf(netRate) {
  const idx = RATES.indexOf(netRate);
  return idx > -1 ? GROSS_RATES[idx] : Math.round(netRate * (1 + VAT_RATE));
}

// --- LOGICĂ PIN & AUTENTIFICARE ---

function handleKeypress(num) {
  triggerHaptic();
  if (pinInput.length < 4) {
    pinInput += num;
    render();
    if (pinInput.length === 4) {
      setTimeout(processPin, 150);
    }
  }
}

function clearPin() {
  triggerHaptic();
  pinInput = "";
  render();
}

function processPin() {
  if (isCreatingProfile && setupStep === 2) {
    db.users[tempName] = {
      pin: pinInput,
      days: {},
      shifts: {}
    };
    saveDB();
    activeUser = tempName;
    isCreatingProfile = false;
    setupStep = 1;
    tempName = "";
    pinInput = "";
    render();
  } else {
    const matchedUser = Object.keys(db.users).find(u => db.users[u].pin === pinInput);
    if (matchedUser) {
      activeUser = matchedUser;
      pinInput = "";
      render();
    } else {
      alert("PIN incorect!");
      pinInput = "";
      render();
    }
  }
}

function logout() {
  triggerHaptic();
  activeUser = null;
  pinInput = "";
  isCreatingProfile = false;
  render();
}

function startNewProfileFlow() {
  const name = prompt("Numele noului operator:");
  if (name && name.trim() !== "") {
    tempName = name.trim();
    isCreatingProfile = true;
    setupStep = 2;
    pinInput = "";
    render();
  }
}

// --- LOGICĂ TURA DE LUCRU ---

function startShift() {
  triggerHaptic();
  const uData = db.users[activeUser];
  if (!uData.shifts) uData.shifts = {};
  const tKey = todayKey();
  
  uData.shifts[tKey] = {
    start: new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' }),
    end: null,
    active: true
  };
  saveDB();
  render();
}

function stopShift() {
  if (confirm("Ești sigur că vrei să închei tura de astăzi?")) {
    triggerHaptic();
    const uData = db.users[activeUser];
    const tKey = todayKey();
    if (uData.shifts && uData.shifts[tKey]) {
      uData.shifts[tKey].end = new Date().toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
      uData.shifts[tKey].active = false;
      saveDB();
      render();
    }
  }
}

// --- LOGICĂ TEREN ---

function addEntry(rate) {
  triggerHaptic();
  const uData = db.users[activeUser];
  const tKey = todayKey();
  if (!uData.days[tKey]) uData.days[tKey] = [];
  
  uData.days[tKey].push(rate);
  saveDB();

  justAddedRate = rate;
  render();
  setTimeout(() => { justAddedRate = null; render(); }, 300);
}

function undoLastEntry() {
  triggerHaptic();
  const uData = db.users[activeUser];
  const tKey = todayKey();
  if (uData.days[tKey] && uData.days[tKey].length > 0) {
    uData.days[tKey].pop();
    saveDB();
    render();
  }
}

function exportCSV() {
  const uData = db.users[activeUser];
  let csv = 'Data,Start Tura,Stop Tura,Tarif Brut (RON),Tarif Net (RON)\n';
  Object.keys(uData.days).sort().forEach(date => {
    const shift = (uData.shifts && uData.shifts[date]) ? uData.shifts[date] : { start: '-', end: '-' };
    uData.days[date].forEach(r => {
      csv += `"${date}","${shift.start || '-'}","${shift.end || '-'} font",${grossOf(r)},${r}\n`;
    });
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Revizio_${activeUser}_${monthKey()}.csv`;
  a.click();
}

// --- RENDER ---

function renderKeypad() {
  return `
    <div class="pin-dots">
      ${[0,1,2,3].map(i => `<div class="pin-dot ${i < pinInput.length ? 'active' : ''}"></div>`).join('')}
    </div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="keypad-btn" onclick="handleKeypress('${n}')">${n}</button>`).join('')}
      <button class="keypad-btn" style="font-size:12px; color:var(--danger)" onclick="clearPin()">C</button>
      <button class="keypad-btn" onclick="handleKeypress('0')">0</button>
      <button class="keypad-btn" style="font-size:14px; opacity:0" disabled></button>
    </div>
  `;
}

function render() {
  const root = document.getElementById('root');
  const userCount = Object.keys(db.users).length;

  if (userCount === 0 && !activeUser && !isCreatingProfile) {
    isCreatingProfile = true;
    setupStep = 1;
  }

  if (isCreatingProfile && setupStep === 1) {
    root.innerHTML = `
      <div style="padding-top: 40px; text-align: center;">
        <div style="font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 8px;">REVIZIO 2.0</div>
        <p style="color: var(--ink-soft); font-size: 14px; margin-bottom: 24px;">Configurare profil nou</p>
        <div class="card">
          <input type="text" id="nameInput" class="input-field" placeholder="Numele tău (ex: Marius)" />
          <button class="btn-main" onclick="
            const val = document.getElementById('nameInput').value.trim();
            if(val) { tempName = val; setupStep = 2; render(); }
            else { alert('Introdu un nume valid'); }
          ">Pasul Următor</button>
        </div>
      </div>
    `;
    return;
  }

  if (isCreatingProfile && setupStep === 2) {
    root.innerHTML = `
      <div style="padding-top: 40px; text-align: center;">
        <div style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">Setează un PIN (4 cifre)</div>
        <p style="color: var(--ink-soft); font-size: 13px;">Profil: <b>${tempName}</b></p>
        ${renderKeypad()}
      </div>
    `;
    return;
  }

  if (!activeUser) {
    root.innerHTML = `
      <div style="padding-top: 40px; text-align: center;">
        <div style="font-size: 26px; font-weight: 800; color: var(--accent); margin-bottom: 6px;">REVIZIO</div>
        <p style="color: var(--ink-soft); font-size: 13px; margin-bottom: 20px;">Introdu PIN-ul de acces</p>
        
        ${renderKeypad()}

        <div style="margin-top: 30px;">
          <button onclick="startNewProfileFlow()" style="background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; cursor:pointer;">
            + Adaugă alt profil
          </button>
        </div>
      </div>
    `;
    return;
  }

  // --- ECRAN PRINCIPAL ---
  const uData = db.users[activeUser];
  const tKey = todayKey();
  const mKey = monthKey();

  if (!uData.shifts) uData.shifts = {};
  const currentShift = uData.shifts[tKey] || { active: false, start: null, end: null };

  const todayEntries = uData.days[tKey] || [];
  const todaySum = todayEntries.reduce((a, b) => a + b, 0);
  const todayProgress = Math.min(100, (todaySum / DAILY_TARGET) * 100);
  const todayOverage = Math.max(0, todaySum - DAILY_TARGET);
  const todayBonus = todayOverage * BONUS_RATE;

  let monthSum = 0;
  let monthCount = 0;
  Object.keys(uData.days).filter(k => k.startsWith(mKey)).forEach(k => {
    (uData.days[k] || []).forEach(r => {
      monthSum += r;
      monthCount++;
    });
  });

  root.innerHTML = `
    <!-- Top Bar -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <div>
        <div style="font-size: 20px; font-weight: 800; color: var(--accent);">REVIZIO</div>
        <div style="font-size: 12px; color: var(--ink-soft);">Operator: <b>${activeUser}</b></div>
      </div>
      <button onclick="logout()" style="background: var(--surface); border: 1px solid var(--border); color: var(--warn); border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 600; cursor:pointer;">
        Ieșire (Lock)
      </button>
    </div>

    <!-- CONTROL TURĂ (START / STOP) -->
    <div class="card" style="text-align: center;">
      ${!currentShift.start && !currentShift.active ? `
        <div style="font-size: 13px; color: var(--ink-soft); margin-bottom: 12px;">Tura ta nu a început încă pentru astăzi.</div>
        <button class="btn-good" onclick="startShift()">▶️ ÎNCEPE TURA</button>
      ` : currentShift.active ? `
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
          <span style="font-size: 12px; color: var(--good); font-weight: 700;">● TURĂ ACTIVĂ</span>
          <span style="font-size: 12px; color: var(--ink-soft);">Start la ora: <b>${currentShift.start}</b></span>
        </div>
        <button class="btn-danger" onclick="stopShift()">⏹️ ÎNCHEIE TURA DE AZI</button>
      ` : `
        <div style="font-size: 13px; color: var(--warn); font-weight: 600;">TURĂ ÎNCHEIATĂ PE AZI (${currentShift.start} - ${currentShift.end})</div>
        <div style="font-size: 11px; color: var(--ink-faint); margin-top: 4px;">Tura se va reseta automat mâine dimineață.</div>
      `}
    </div>

    <!-- Card Astăzi -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
        <span style="font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase;">Astăzi</span>
        <span style="font-size: 11px; color: var(--ink-faint);">țintă ${fmtRON(DAILY_TARGET)}</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px;">
        <span style="font-size: 32px; font-weight: 800;">${fmtRON(todaySum).replace(' lei','')}</span>
        <span style="font-size: 14px; color: var(--ink-faint);">lei net</span>
      </div>
      <div class="progress-bg" style="margin-bottom: 10px;">
        <div class="progress-bar" style="width: ${todayProgress}%; background: ${todayProgress >= 100 ? 'var(--good)' : 'var(--accent)'};"></div>
      </div>
      ${todayOverage > 0 ? `
        <div style="display: flex; justify-content: space-between; align-items: center; background: var(--good-bg); border-radius: 10px; padding: 8px 12px;">
          <span style="font-size: 12px; color: var(--good); font-weight: 600;">Bonus azi (+31%)</span>
          <span style="font-size: 14px; font-weight: 700; color: var(--good);">+${fmtRON(todayBonus)}</span>
        </div>
      ` : `
        <div style="font-size: 12px; color: var(--ink-soft);">Rămas de realizat: <b>${fmtRON(Math.max(0, DAILY_TARGET - todaySum))}</b></div>
      `}
    </div>

    <!-- 1-TAP RATE BUTTONS -->
    <div class="btn-grid">
      ${RATES.map((rate, i) => `
        <button onclick="addEntry(${rate})" ${!currentShift.active ? 'disabled' : ''} class="btn-rate ${justAddedRate === rate ? 'just-added' : ''}">
          <span style="font-size: 22px; font-weight: 800;">${GROSS_RATES[i]}</span>
          <span style="font-size: 10px; opacity: 0.7;">lei cu TVA</span>
          <span style="font-size: 10px; color: var(--accent); margin-top: 2px;">${rate.toFixed(1)} net</span>
        </button>
      `).join('')}
    </div>

    ${todayEntries.length > 0 && currentShift.active ? `
      <button onclick="undoLastEntry()" style="width: 100%; font-size: 12px; font-weight: 600; color: var(--warn); background: var(--warn-bg); border: none; border-radius: 12px; padding: 10px; margin-bottom: 14px; cursor:pointer;">
        Anulează ultima adăugare (${grossOf(todayEntries[todayEntries.length - 1])} lei)
      </button>
    ` : ''}

    <!-- Card Lună -->
    <div class="card">
      <div style="font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 8px;">Luna Curentă (${mKey})</div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
        <span style="font-size: 22px; font-weight: 800; color: var(--good);">${fmtRON(monthSum)}</span>
        <span style="font-size: 12px; color: var(--ink-faint);">${monthCount} verificări</span>
      </div>
    </div>

    <button onclick="exportCSV()" style="width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--ink); border-radius: 12px; padding: 12px; font-size: 12px; font-weight: 600; cursor:pointer;">
      📥 Export Excel / CSV
    </button>
  `;
}

render();
</script>
</body>
</html>
