<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Finora</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <main class="app-container">
    <section class="card" id="summary-card">
      <h2 class="card-title">Net Balance</h2>
      <div class="metric-display" id="net-balance">$0.00</div>
    </section>

    <section class="card" id="transaction-form-card">
      <h2 class="card-title">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <input type="text" id="tx-title" placeholder="Transaction Title (e.g. Salary, Rent)" required>
        </div>
        <div class="form-group">
          <input type="number" id="tx-amount" placeholder="0.00" step="0.01" min="0.01" required>
        </div>
        <div class="form-group">
          <select id="tx-type" required>
            <option value="expense">Expense</option>
            <option value="income">Income</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Save Transaction</button>
        <div id="form-error" class="error-msg hidden"></div>
      </form>
    </section>

    <section class="card" id="history-card">
      <h2 class="card-title">Recent Activity</h2>
      <ul id="transaction-list" class="list-group"></ul>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
