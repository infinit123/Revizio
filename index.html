<script>
const { useState, useEffect, useMemo, useCallback } = React;

const VAT_RATE = 0.21;
const GROSS_RATES = [190, 290, 310];
const RATES = GROSS_RATES.map(r => Math.round((r / (1 + VAT_RATE)) * 100) / 100);
const DEFAULT_TARGET = 1500;
const BONUS_RATE = 0.31;
const STORAGE_KEY = 'revizii_data_v2';
const USERS_KEY = 'eon_app_users';
const SETTINGS_KEY = 'eon_app_settings';

function todayKey(d = new Date()) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}
function monthKey(d = new Date()) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  return `${year}-${month}`;
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { days: {} };
}
function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}
function loadUsers() {
  try {
    const raw = localStorage.getItem(USERS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [];
}
function saveUsers(users) {
  try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch (e) {}
}
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { dailyTarget: DEFAULT_TARGET };
}
function saveSettings(settings) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}

function countWorkdays(year, month, uptoDay) {
  let count = 0;
  const lastDay = uptoDay || new Date(year, month + 1, 0).getDate();
  for (let d = 1; d <= lastDay; d++) {
    const dow = new Date(year, month, d).getDay();
    if (dow >= 1 && dow <= 5) count++;
  }
  return count;
}
function grossOf(netRate) {
  const idx = RATES.indexOf(netRate);
  return idx > -1 ? GROSS_RATES[idx] : Math.round(netRate * (1 + VAT_RATE));
}
function fmtRON(n) {
  return new Intl.NumberFormat('ro-RO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n) + ' lei';
}
function dayLabel(key) {
  const d = new Date(key + 'T00:00:00');
  const days = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
  const months = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
  return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;
}
function monthLabel(monthStr) {
  const [y, m] = monthStr.split('-');
  const months = ['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
  return `${months[parseInt(m, 10) - 1]} ${y}`;
}

// Componenta de Autentificare & Inregistrare
function Auth({ onLoginSuccess, theme, toggleTheme }) {
  const [isSignUp, setIsSignUp] = useState(false);
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [confirmPassword, setConfirmPassword] = useState('');
  const [role, setRole] = useState('MRV');
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    setError(''); setSuccess('');
    const uName = username.trim();
    if (!uName || !password) { setError('Completează toate câmpurile.'); return; }

    const users = loadUsers();

    if (isSignUp) {
      if (password !== confirmPassword) { setError('Parolele nu se potrivesc.'); return; }
      if (users.find(u => u.username.toLowerCase() === uName.toLowerCase())) {
        setError('Numele de utilizator este deja folosit.'); return;
      }
      users.push({ username: uName, password, role });
      saveUsers(users);
      setSuccess('Cont creat cu succes!');
      setIsSignUp(false); setPassword(''); setConfirmPassword('');
    } else {
      const user = users.find(u => u.username.toLowerCase() === uName.toLowerCase() && u.password === password);
      if (!user && users.length === 0 && uName.toLowerCase() === 'admin' && password === '1234') {
        onLoginSuccess(uName, 'MRV'); return;
      }
      if (user) onLoginSuccess(user.username, user.role || 'MRV');
      else setError('Nume de utilizator sau parolă incorectă.');
    }
  };

  return h('div', { style: { maxWidth: 380, margin: '0 auto', paddingTop: 40, paddingLeft: 20, paddingRight: 20 } },
    h('div', { style: { display: 'flex', justifyContent: 'flex-end', marginBottom: 20 } },
      h('button', {
        onClick: toggleTheme,
        className: 'glass-button',
        style: { borderRadius: '50%', width: 44, height: 44, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 18, color: 'var(--ink)' }
      }, theme === 'light' ? '🌙' : '☀️')
    ),
    h('div', { className: 'glass-card', style: { padding: 28, textAlign: 'center' } },
      h('div', { className: 'eon-brand-text', style: { marginBottom: 8, fontSize: 16 } }, 'E.ON Asist Complet'),
      h('h2', { style: { marginBottom: 6, marginTop: 0, color: 'var(--ink)' } }, isSignUp ? 'Creare Cont' : 'Autentificare'),
      h('p', { style: { color: 'var(--ink-faint)', fontSize: 13, marginBottom: 20 } }, 
        isSignUp ? 'Alege funcția și creează un cont.' : 'Introdu datele de acces pentru a continua.'
      ),
      
      h('form', { onSubmit: handleSubmit, style: { display: 'flex', flexDirection: 'column', gap: 12 } },
        h('input', {
          type: 'text', value: username, onChange: (e) => setUsername(e.target.value), placeholder: 'Utilizator',
          style: { padding: '14px', borderRadius: 12, border: '1px solid var(--border)', background: 'rgba(255,255,255,0.2)', color: 'var(--ink)', fontSize: 15, outline: 'none' }
        }),

        isSignUp && h('div', { style: { textAlign: 'left' } },
          h('label', { style: { fontSize: 12, fontWeight: 600, color: 'var(--ink-soft)', marginBottom: 6, display: 'block' } }, 'Selectează Funcția Ocupată:'),
          h('div', { style: { display: 'flex', gap: 10 } },
            h('button', {
              type: 'button', onClick: () => setRole('MRV'),
              style: {
                flex: 1, padding: '10px', borderRadius: 10, border: '1px solid var(--border)',
                background: role === 'MRV' ? 'var(--accent)' : 'transparent',
                color: role === 'MRV' ? '#fff' : 'var(--ink)', fontSize: 12, fontWeight: 600, cursor: 'pointer'
              }
            }, 'MRV (Montator)'),
            h('button', {
              type: 'button', onClick: () => setRole('ORV'),
              style: {
                flex: 1, padding: '10px', borderRadius: 10, border: '1px solid var(--border)',
                background: role === 'ORV' ? 'var(--accent)' : 'transparent',
                color: role === 'ORV' ? '#fff' : 'var(--ink)', fontSize: 12, fontWeight: 600, cursor: 'pointer'
              }
            }, 'ORV (Operator)')
          )
        ),

        h('input', {
          type: 'password', value: password, onChange: (e) => setPassword(e.target.value), placeholder: 'Parolă',
          style: { padding: '14px', borderRadius: 12, border: '1px solid var(--border)', background: 'rgba(255,255,255,0.2)', color: 'var(--ink)', fontSize: 15, outline: 'none' }
        }),
        isSignUp && h('input', {
          type: 'password', value: confirmPassword, onChange: (e) => setConfirmPassword(e.target.value), placeholder: 'Confirmă Parola',
          style: { padding: '14px', borderRadius: 12, border: '1px solid var(--border)', background: 'rgba(255,255,255,0.2)', color: 'var(--ink)', fontSize: 15, outline: 'none' }
        }),

        success && h('div', { style: { color: 'var(--good)', fontSize: 13 } }, success),
        
        h('button', {

        h('button', {

          style: { background: 'none', border: 'none', color: 'var(--accent)', fontSize: 13, cursor: 'pointer', marginTop: 10 }

      )
    )
  );
}

// Tab Performanță & Analytics cu Grafic
function AnalyticsTab({ data, dailyTarget }) {
  const monthsData = useMemo(() => {
    const keys = Object.keys(data.days);
    const monthMap = {};

    keys.forEach(key => {
      const mKey = key.slice(0, 7);
      const entries = data.days[key] || [];
      const sum = entries.reduce((a, b) => a + b, 0);
      const count = entries.length;

      if (!monthMap[mKey]) {
        monthMap[mKey] = { sum: 0, count: 0, daysCount: 0 };
      }
      monthMap[mKey].sum += sum;
      monthMap[mKey].count += count;
      if (count > 0) monthMap[mKey].daysCount += 1;
    });

    const sortedMonths = Object.keys(monthMap).sort();
    return sortedMonths.map(m => ({
      monthKey: m,
      label: monthLabel(m),
      sum: monthMap[m].sum,
      count: monthMap[m].count,
      daysCount: monthMap[m].daysCount
    }));
  }, [data]);

  const maxVal = useMemo(() => {
    if (monthsData.length === 0) return 1;
    return Math.max(...monthsData.map(m => m.sum), 1);
  }, [monthsData]);

  // Comparare ultimele 2 luni
  const comparison = useMemo(() => {
    if (monthsData.length < 2) return null;
    const current = monthsData[monthsData.length - 1];
    const prev = monthsData[monthsData.length - 2];
    const diffSum = current.sum - prev.sum;
    const diffCount = current.count - prev.count;
    const percentDiff = prev.sum > 0 ? ((diffSum / prev.sum) * 100).toFixed(1) : 0;
    return { current, prev, diffSum, diffCount, percentDiff };
  }, [monthsData]);

  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
    // Card Comparativ Luna Curentă vs Luna Trecută
    comparison && h('div', { className: 'glass-card', style: { padding: 20 } },
      h('div', { style: { fontSize: 13, fontWeight: 600, color: 'var(--ink-soft)', textTransform: 'uppercase', marginBottom: 10 } }, '⚡ Comparație Lunară Directă'),
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 } },
        h('div', null,
          h('div', { style: { fontSize: 12, color: 'var(--ink-faint)' } }, comparison.prev.label),
          h('div', { style: { fontSize: 16, fontWeight: 700 } }, fmtRON(comparison.prev.sum)),
          h('div', { style: { fontSize: 12, color: 'var(--ink-soft)' } }, `${comparison.prev.count} lucrări`)
        ),
        h('div', { style: { fontSize: 20, color: 'var(--ink-faint)' } }, '➔'),
        h('div', { style: { textAlign: 'right' } },
          h('div', { style: { fontSize: 12, color: 'var(--ink-faint)' } }, comparison.current.label),
          h('div', { style: { fontSize: 16, fontWeight: 700, color: 'var(--accent)' } }, fmtRON(comparison.current.sum)),
          h('div', { style: { fontSize: 12, color: 'var(--ink-soft)' } }, `${comparison.current.count} lucrări`)
        )
      ),
      h('div', {
        style: {
          padding: '10px 12px', borderRadius: 12, fontSize: 13, fontWeight: 600, textAlign: 'center',
          background: comparison.diffSum >= 0 ? 'var(--good-bg)' : 'var(--warn-bg)',

        }
      },
        comparison.diffSum >= 0
          ? `▲ Crestere cu ${comparison.percentDiff}% (+${fmtRON(comparison.diffSum)}) față de luna trecută`
          : `▼ Scădere cu ${Math.abs(comparison.percentDiff)}% (-${fmtRON(Math.abs(comparison.diffSum))}) față de luna trecută`
      )
    ),

    // Grafic de Performanță pe Termen Lung
    h('div', { className: 'glass-card', style: { padding: 20 } },
      h('h3', { style: { marginTop: 0, marginBottom: 4, fontSize: 16 } }, '📈 Evoluție Performanță pe Termen Lung'),
      h('p', { style: { fontSize: 12, color: 'var(--ink-soft)', marginTop: 0, marginBottom: 20 } }, 'Total încasări (fără TVA) realizate pe fiecare lună'),
      
      monthsData.length === 0
        ? h('div', { style: { textAlign: 'center', color: 'var(--ink-faint)', padding: 20, fontSize: 13 } }, 'Nu există suficiente date introduse.')
        : h('div', { style: { display: 'flex', alignItems: 'flex-end', gap: 12, height: 180, paddingTop: 20, paddingBottom: 10, borderBottom: '1px solid var(--border)', overflowX: 'auto' } },
            monthsData.map((m) => {
              const heightPct = Math.max(12, (m.sum / maxVal) * 100);
              return h('div', { key: m.monthKey, style: { flex: 1, minWidth: 45, display: 'flex', flexDirection: 'column', alignItems: 'center', height: '100%', justifyContent: 'flex-end' } },
                h('div', { style: { fontSize: 10, fontWeight: 700, color: 'var(--ink)', marginBottom: 4 } }, Math.round(m.sum)),
                h('div', {
                  style: {
                    width: '100%', maxWidth: 28, height: `${heightPct}%`, background: 'var(--accent)', borderRadius: '6px 6px 0 0',
                    boxShadow: '0 4px 10px rgba(226, 0, 26, 0.25)', transition: 'height 0.4s ease'
                  }
                }),
                h('div', { style: { fontSize: 10, color: 'var(--ink-faint)', marginTop: 8, whiteSpace: 'nowrap', textTransform: 'capitalize' } }, m.monthKey.slice(5))
              );
            })
          )
    ),

    // Istoric detaliat pe fiecare lună
    h('div', { className: 'glass-card', style: { padding: 20 } },
      h('h3', { style: { marginTop: 0, marginBottom: 12, fontSize: 16 } }, '📋 Totaluri Lunare Istorice'),
      h('div', { style: { display: 'flex', flexDirection: 'column', gap: 10 } },
        monthsData.map(m =>
          h('div', { key: m.monthKey, style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'var(--bg)', borderRadius: 12 } },
            h('div', null,
              h('div', { style: { fontWeight: 600, fontSize: 14 } }, m.label),
              h('div', { style: { fontSize: 12, color: 'var(--ink-faint)' } }, `${m.count} lucrări executate`)
            ),
            h('div', { style: { textAlign: 'right' } },
              h('div', { style: { fontWeight: 700, fontSize: 15, color: 'var(--ink)' } }, fmtRON(m.sum))
            )
          )
        )
      )
    )
  );
}

// Tabul de Gestiune Date
function DataTab({ data, setData }) {
  const [statusMsg, setStatusMsg] = useState(null);
  const [confirmReset, setConfirmReset] = useState(false);

  const handleExport = () => {
    const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(data, null, 2))}`;
    const downloadAnchor = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    downloadAnchor.setAttribute("href", jsonString);
    downloadAnchor.setAttribute("download", `backup_revizii_${dateStr}.json`);
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    setStatusMsg({ type: 'success', text: 'Salvarea backup-ului a reușit!' });
    setTimeout(() => setStatusMsg(null), 3000);
  };

  const handleImport = (e) => {
    const fileReader = new FileReader();
    const file = e.target.files[0];
    if (!file) return;

    fileReader.readAsText(file, "UTF-8");
    fileReader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (parsed && typeof parsed === 'object' && parsed.days) {
          setData(parsed);
          setStatusMsg({ type: 'success', text: 'Datele au fost importate cu succes!' });
        } else {
          setStatusMsg({ type: 'error', text: 'Formatul fișierului este invalid.' });
        }
      } catch (err) {
        setStatusMsg({ type: 'error', text: 'Eroare la citirea fișierului JSON.' });
      }
      setTimeout(() => setStatusMsg(null), 3000);
    };
  };

  return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 16 } },
    h('div', { className: 'glass-card', style: { padding: 20 } },
      h('h3', { style: { marginTop: 0, marginBottom: 6, fontSize: 16 } }, 'Exportă Datele'),
      h('p', { style: { fontSize: 13, color: 'var(--ink-soft)', marginTop: 0, marginBottom: 16 } }, 'Descarcă o copie de siguranță a înregistrărilor tale pe telefon sau calculator.'),
      h('button', {
        onClick: handleExport,
        style: { width: '100%', padding: '12px', borderRadius: 12, border: 'none', background: 'var(--accent)', color: '#fff', fontWeight: 600, fontSize: 14, cursor: 'pointer', boxShadow: '0 4px 12px rgba(226,0,26,0.3)' }
      }, 'Descarcă Backup (.json)')
    ),

    h('div', { className: 'glass-card', style: { padding: 20 } },
      h('h3', { style: { marginTop: 0, marginBottom: 6, fontSize: 16 } }, 'Importă Datele'),
      h('p', { style: { fontSize: 13, color: 'var(--ink-soft)', marginTop: 0, marginBottom: 16 } }, 'Încarcă un fișier de backup (.json) salvat anterior.'),
      h('label', {
        className: 'glass-button',
        style: { display: 'block', width: '100%', padding: '12px', borderRadius: 12, color: 'var(--ink)', fontWeight: 600, fontSize: 14, textAlign: 'center', cursor: 'pointer' }
      },
        'Alege Fișier Backup',
        h('input', { type: 'file', accept: '.json', onChange: handleImport, style: { display: 'none' } })
      )
    ),

    statusMsg && h('div', {
      style: {
        padding: '12px', borderRadius: 12, fontSize: 13, fontWeight: 500, textAlign: 'center',
        background: statusMsg.type === 'success' ? 'var(--good-bg)' : 'var(--warn-bg)',
        color: statusMsg.type === 'success' ? 'var(--good)' : 'var(--warn)'
      }
    }, statusMsg.text),

    h('div', { style: { marginTop: 20, textAlign: 'center' } },
      !confirmReset
        ? h('button', {
            onClick: () => setConfirmReset(true),
            style: { background: 'none', border: 'none', color: 'var(--warn)', fontSize: 13, fontWeight: 500, fontFamily: 'inherit', cursor: 'pointer' }
          }, 'Șterge toate datele din aplicație')
        : h('div', { className: 'glass-card', style: { display: 'flex', gap: 12, justifyContent: 'center', alignItems: 'center', padding: 16 } },
            h('span', { style: { fontSize: 13, color: 'var(--warn)', fontWeight: 500 } }, 'Sigur ștergi tot?'),
            h('button', {
              onClick: () => { setData({ days: {} }); setConfirmReset(false); setStatusMsg({ type: 'success', text: 'Datele au fost șterse.' }); },
              style: { background: 'var(--warn)', border: 'none', color: '#fff', padding: '6px 12px', borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: 'pointer' }
            }, 'Da, șterge'),
            h('button', {
              onClick: () => setConfirmReset(false),
              style: { background: 'transparent', border: '1px solid var(--border)', color: 'var(--ink)', padding: '6px 12px', borderRadius: 8, fontSize: 12, cursor: 'pointer' }
            }, 'Anulează')
          )
    )
  );
}

// Componenta Dashboard Principal
function MainDashboard({ data, setData, dailyTarget, selectedDate }) {
  const [justAdded, setJustAdded] = useState(null);
  const [showHistory, setShowHistory] = useState(false);
  const [showCustomModal, setShowCustomModal] = useState(false);
  const [customGrossInput, setCustomGrossInput] = useState('');

  const tKey = todayKey(selectedDate);
  const mKey = monthKey(selectedDate);

  const todayEntries = data.days[tKey] || [];
  const todaySum = todayEntries.reduce((a, b) => a + b, 0);

  const todayCounts = RATES.reduce((acc, r) => {
    acc[r] = todayEntries.filter(e => e === r).length;
    return acc;
  }, {});

  const customEntries = todayEntries.filter(e => !RATES.includes(e));

  const monthDays = useMemo(() => Object.keys(data.days).filter(k => k.startsWith(mKey)), [data, mKey]);
  const monthSum = monthDays.reduce((sum, k) => sum + (data.days[k] || []).reduce((a,b)=>a+b,0), 0);

  const year = selectedDate.getFullYear();
  const month = selectedDate.getMonth();
  const totalWorkdaysInMonth = countWorkdays(year, month);
  const workdaysSoFar = countWorkdays(year, month, selectedDate.getDate());
  const monthlyTarget = totalWorkdaysInMonth * dailyTarget;
  const expectedSoFar = workdaysSoFar * dailyTarget;

  const monthProgress = monthlyTarget > 0 ? Math.min(100, (monthSum / monthlyTarget) * 100) : 0;
  const todayProgress = Math.min(100, (todaySum / dailyTarget) * 100);
  const remainingToday = Math.max(0, dailyTarget - todaySum);
  const diffVsExpected = monthSum - expectedSoFar;

  const addEntry = useCallback((netRate) => {
    setData(prev => {
      const next = { ...prev, days: { ...prev.days } };
      const arr = next.days[tKey] ? [...next.days[tKey]] : [];
      arr.push(netRate);
      next.days[tKey] = arr;
      return next;
    });
    setJustAdded(netRate);
    setTimeout(() => setJustAdded(null), 600);
    if (navigator.vibrate) navigator.vibrate(10);
  }, [tKey, setData]);

  const handleAddCustom = (e) => {
    e.preventDefault();
    const grossVal = parseFloat(customGrossInput);
    if (isNaN(grossVal) || grossVal <= 0) return;
    const netVal = Math.round((grossVal / (1 + VAT_RATE)) * 100) / 100;
    addEntry(netVal);
    setCustomGrossInput('');
    setShowCustomModal(false);
  };

  const removeLastEntry = useCallback((netRate) => {
    setData(prev => {
      const next = { ...prev, days: { ...prev.days } };
      const arr = next.days[tKey] ? [...next.days[tKey]] : [];
      const idx = arr.lastIndexOf(netRate);
      if (idx > -1) arr.splice(idx, 1);
      next.days[tKey] = arr;
      return next;
    });
  }, [tKey, setData]);

  const undoLastEntry = useCallback(() => {
    setData(prev => {
      const next = { ...prev, days: { ...prev.days } };
      const arr = next.days[tKey] ? [...next.days[tKey]] : [];
      if (arr.length === 0) return prev;
      arr.pop();
      next.days[tKey] = arr;
      return next;
    });
    if (navigator.vibrate) navigator.vibrate([10, 30, 10]);
  }, [tKey, setData]);

  const monthDaysSorted = useMemo(() => {
    return monthDays.filter(k => (data.days[k] || []).length > 0).sort((a, b) => b.localeCompare(a));
  }, [monthDays, data]);

  const avgPerWorkday = workdaysSoFar > 0 ? monthSum / workdaysSoFar : 0;
  const todayOverage = Math.max(0, todaySum - dailyTarget);
  const todayBonus = todayOverage * BONUS_RATE;
  const monthOverage = Math.max(0, monthSum - monthlyTarget);
  const monthBonus = monthOverage * BONUS_RATE;

  return h('div', null,
    // Today card
    h('div', { className: 'glass-card', style: { padding: '20px', marginBottom: 14 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 } },
        h('span', { style: { fontSize: 13, fontWeight: 600, color: 'var(--ink-soft)', textTransform: 'uppercase', letterSpacing: '0.03em' } }, dayLabel(tKey)),
        h('span', { style: { fontSize: 13, color: 'var(--ink-faint)' } }, `țintă ${fmtRON(dailyTarget)}`)
      ),
      h('div', { style: { display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 14 } },
        h('span', { style: { fontSize: 40, fontWeight: 800, color: 'var(--ink)', letterSpacing: '-0.02em', fontVariantNumeric: 'tabular-nums' } }, fmtRON(todaySum).replace(' lei','')),
        h('span', { style: { fontSize: 18, color: 'var(--ink-faint)', fontWeight: 500 } }, 'lei')
      ),
      h('div', { style: { height: 10, background: 'rgba(0,0,0,0.06)', borderRadius: 6, overflow: 'hidden', marginBottom: 10 } },
        h('div', { style: { height: '100%', width: todayProgress + '%', background: todayProgress >= 100 ? 'var(--good)' : 'var(--accent)', borderRadius: 6, transition: 'width 0.4s ease' } })
      ),
      h('div', { style: { fontSize: 14, color: todayProgress >= 100 ? 'var(--good)' : 'var(--ink-soft)', fontWeight: 500 } },
        todayProgress >= 100 ? `Țintă atinsă. Peste target cu ${fmtRON(todayOverage)}.` : `Mai ai nevoie de ${fmtRON(remainingToday)}.`
      ),
      todayOverage > 0 && h('div', { style: { marginTop: 10, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--accent-light)', borderRadius: 12, padding: '10px 12px', border: '1px solid var(--border-dark)' } },
        h('span', { style: { fontSize: 13, color: 'var(--accent)', fontWeight: 600 } }, 'Bonus 31% azi'),
        h('span', { style: { fontSize: 16, fontWeight: 700, color: 'var(--accent)', fontVariantNumeric: 'tabular-nums' } }, fmtRON(todayBonus))
      )
    ),

    // Rate buttons
    h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10, marginBottom: 10 } },
      RATES.map((rate, i) =>
        h('button', {
          key: rate,
          onClick: () => addEntry(rate),
          className: 'glass-button',
          style: {
            background: justAdded === rate ? 'var(--accent)' : 'var(--surface)',
            color: justAdded === rate ? '#fff' : 'var(--ink)',
            borderColor: justAdded === rate ? 'var(--accent)' : 'var(--border)',
            borderRadius: 16, padding: '16px 8px', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, fontFamily: 'inherit', cursor: 'pointer'
          }
        },
          h('span', { style: { fontSize: 22, fontWeight: 800, fontVariantNumeric: 'tabular-nums' } }, GROSS_RATES[i]),
          h('span', { style: { fontSize: 11, opacity: 0.8, fontWeight: 500 } }, 'lei cu TVA'),
          h('span', { style: { fontSize: 11, fontWeight: 500, fontVariantNumeric: 'tabular-nums', color: justAdded === rate ? 'rgba(255,255,255,0.85)' : 'var(--ink-faint)' } }, `fără TVA: ${rate.toFixed(2)}`),
          todayCounts[rate] > 0 && h('span', { style: { marginTop: 2, fontSize: 12, fontWeight: 600, background: justAdded === rate ? 'rgba(255,255,255,0.25)' : 'var(--accent-light)', color: justAdded === rate ? '#fff' : 'var(--accent)', borderRadius: 20, padding: '2px 8px' } }, `x${todayCounts[rate]}`)
        )
      )
    ),

    // Custom Button
    h('button', {
      onClick: () => setShowCustomModal(true),
      className: 'glass-button',
      style: {
        width: '100%', color: 'var(--accent)', borderRadius: 14, padding: '12px', fontSize: 14, fontWeight: 600, cursor: 'pointer', marginBottom: 10, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, borderStyle: 'dashed'
      }
    }, '➕ Adaugă sumă personalizată (cu TVA)'),

    h('div', { style: { fontSize: 11, color: 'var(--ink-faint)', textAlign: 'center', marginBottom: 14 } }, 'Toate calculele de mai sus sunt fără TVA'),

    // Undo last entry
    todayEntries.length > 0 && h('button', {
      onClick: undoLastEntry,
      style: { width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 13, fontWeight: 500, color: 'var(--warn)', background: 'var(--warn-bg)', border: 'none', borderRadius: 12, padding: '10px 12px', fontFamily: 'inherit', cursor: 'pointer', marginBottom: 12 }
    }, `Anulează ultima verificare adăugată (${grossOf(todayEntries[todayEntries.length - 1])} lei)`),

    // Per-rate undo
    todayEntries.length > 0 && h('div', { style: { display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' } },
      RATES.filter(r => todayCounts[r] > 0).map(rate =>
        h('button', {
          key: 'undo-' + rate, onClick: () => removeLastEntry(rate), className: 'glass-button',
          style: { fontSize: 12, color: 'var(--ink-faint)', borderRadius: 20, padding: '6px 12px', fontFamily: 'inherit', cursor: 'pointer' }
        }, `- o verificare de ${grossOf(rate)}`)
      ),
      customEntries.map((netRate, idx) =>
        h('button', {
          key: 'undo-custom-' + idx, onClick: () => removeLastEntry(netRate), className: 'glass-button',
          style: { fontSize: 12, color: 'var(--warn)', borderRadius: 20, padding: '6px 12px', fontFamily: 'inherit', cursor: 'pointer' }
        }, `- suma ${grossOf(netRate)} lei`)
      )
    ),

    // Month card
    h('div', { className: 'glass-card', style: { padding: '20px', marginBottom: 14 } },
      h('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 14 } },
        h('span', { style: { fontSize: 13, fontWeight: 600, color: 'var(--ink-soft)', textTransform: 'uppercase', letterSpacing: '0.03em' } }, 'Luna aceasta'),
        h('span', { style: { fontSize: 13, color: 'var(--ink-faint)' } }, `${workdaysSoFar}/${totalWorkdaysInMonth} zile lucrătoare`)
      ),
      h('div', { style: { display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 4 } },
        h('span', { style: { fontSize: 28, fontWeight: 800, letterSpacing: '-0.01em', fontVariantNumeric: 'tabular-nums' } }, fmtRON(monthSum)),
        h('span', { style: { fontSize: 15, color: 'var(--ink-faint)' } }, `/ ${fmtRON(monthlyTarget)}`)
      ),
      h('div', { style: { height: 10, background: 'rgba(0,0,0,0.06)', borderRadius: 6, overflow: 'hidden', marginTop: 10, marginBottom: 12 } },
        h('div', { style: { height: '100%', width: monthProgress + '%', background: 'var(--accent)', borderRadius: 6, transition: 'width 0.4s ease' } })
      ),
      h('div', { style: { display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 500, color: diffVsExpected >= 0 ? 'var(--good)' : 'var(--warn)', background: diffVsExpected >= 0 ? 'var(--good-bg)' : 'var(--warn-bg)', borderRadius: 12, padding: '8px 12px' } },
        diffVsExpected >= 0 ? `Ești în avans cu ${fmtRON(diffVsExpected)} față de ritmul necesar.` : `Ești în urmă cu ${fmtRON(Math.abs(diffVsExpected))} față de ritmul necesar.`
      ),
      h('div', { style: { marginTop: 12, fontSize: 13, color: 'var(--ink-faint)' } }, `Medie ${fmtRON(avgPerWorkday)} / zi lucrătoare`),
      monthOverage > 0 && h('div', { style: { marginTop: 12, display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: 'var(--accent-light)', borderRadius: 12, padding: '10px 12px', border: '1px solid var(--border-dark)' } },
        h('span', { style: { fontSize: 13, color: 'var(--accent)', fontWeight: 600 } }, 'Bonus 31% luna asta'),
        h('span', { style: { fontSize: 16, fontWeight: 700, color: 'var(--accent)', fontVariantNumeric: 'tabular-nums' } }, fmtRON(monthBonus))
      )
    ),

    // History toggle
    h('button', {
      onClick: () => setShowHistory(s => !s),
      style: { width: '100%', background: 'transparent', border: 'none', color: 'var(--accent)', fontSize: 14, fontWeight: 600, fontFamily: 'inherit', cursor: 'pointer', padding: '10px 0', textAlign: 'center' }
    }, showHistory ? 'Ascunde istoric' : 'Vezi istoric zilnic'),

    showHistory && h('div', { style: { marginTop: 4 } },
      monthDaysSorted.length === 0
        ? h('div', { style: { textAlign: 'center', color: 'var(--ink-faint)', fontSize: 14, padding: 20 } }, 'Nicio înregistrare încă luna asta.')
        : monthDaysSorted.map(key => {
            const entries = data.days[key];
            const sum = entries.reduce((a,b) => a+b, 0);
            const counts = RATES.reduce((acc, r) => { acc[r] = entries.filter(e => e === r).length; return acc; }, {});
            const customs = entries.filter(e => !RATES.includes(e));
            return h('div', {
              key, className: 'glass-card',
              style: { padding: '12px 16px', marginBottom: 8, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }
            },
              h('div', null,
                h('div', { style: { fontSize: 14, fontWeight: 500 } }, dayLabel(key)),
                h('div', { style: { fontSize: 12, color: 'var(--ink-faint)', marginTop: 2 } }, 
                  [
                    ...RATES.filter(r => counts[r] > 0).map(r => `${counts[r]}x${grossOf(r)}`),
                    ...customs.map(c => `1x${grossOf(c)}`)
                  ].join('  ')
                )
              ),
              h('div', { style: { fontSize: 16, fontWeight: 600, fontVariantNumeric: 'tabular-nums' } }, fmtRON(sum))
            );
          })
    ),

    // Modal Custom Rate
    showCustomModal && h('div', {
      style: { position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'rgba(0,0,0,0.4)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 999, padding: 20 }
    },
      h('div', { className: 'glass-card', style: { padding: 24, width: '100%', maxWidth: 360, background: 'var(--surface-solid)' } },
        h('h3', { style: { marginTop: 0, marginBottom: 8, fontSize: 18 } }, 'Sumă Personalizată'),
        h('p', { style: { fontSize: 13, color: 'var(--ink-soft)', marginTop: 0, marginBottom: 16 } }, 'Introdu suma totală încasată de la client (cu TVA 21%).'),
        h('form', { onSubmit: handleAddCustom, style: { display: 'flex', flexDirection: 'column', gap: 12 } },
          h('input', {
            type: 'number', step: 'any', placeholder: 'ex: 450', value: customGrossInput,
            onChange: (e) => setCustomGrossInput(e.target.value), autoFocus: true,
            style: { padding: '12px', borderRadius: 10, border: '1px solid var(--border)', background: 'var(--bg)', color: 'var(--ink)', fontSize: 16 }
          }),
          customGrossInput > 0 && h('div', { style: { fontSize: 12, color: 'var(--ink-faint)' } }, 
            `Fără TVA (21%): ${(parseFloat(customGrossInput) / (1 + VAT_RATE)).toFixed(2)} lei`
          ),
          h('div', { style: { display: 'flex', gap: 10, marginTop: 8 } },
            h('button', {
              type: 'button', onClick: () => setShowCustomModal(false), className: 'glass-button',
              style: { flex: 1, padding: '12px', borderRadius: 10, color: 'var(--ink)', cursor: 'pointer' }
            }, 'Renunță'),
            h('button', {
              type: 'submit',
              style: { flex: 1, padding: '12px', borderRadius: 10, border: 'none', background: 'var(--accent)', color: '#fff', fontWeight: 600, cursor: 'pointer' }
            }, 'Adaugă')
          )
        )
      )
    )
  );
}

// Layout Principal
function AppLayout({ user, userRole, onLogout, theme, toggleTheme }) {
  const [activeTab, setActiveTab] = useState('main');
  const [isDrawerOpen, setIsDrawerOpen] = useState(false);
  const [data, setData] = useState(loadData);
  const [settings, setSettings] = useState(loadSettings);
  const [selectedDateStr, setSelectedDateStr] = useState(todayKey());

  useEffect(() => { saveData(data); }, [data]);

  const selectedDate = useMemo(() => new Date(selectedDateStr + 'T00:00:00'), [selectedDateStr]);

  const handleTargetChange = (newTarget) => {
    setSettings({ dailyTarget: newTarget });
    saveSettings({ dailyTarget: newTarget });
  };

  return h('div', { style: { maxWidth: 480, margin: '0 auto', padding: '20px 16px' } },
    // Side Drawer
    h(SideDrawer, {

// Main App Root
function App() {
  const [currentUser, setCurrentUser] = useState(() => localStorage.getItem('eon_active_user') || null);
  const [userRole, setUserRole] = useState(() => localStorage.getItem('eon_active_role') || 'MRV');
  const [theme, setTheme] = useState(() => localStorage.getItem('revizii_theme') || 'light');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('revizii_theme', theme);
  }, [theme]);

  const handleLoginSuccess = (username, role) => {
    localStorage.setItem('eon_active_user', username);
    localStorage.setItem('eon_active_role', role);
    setCurrentUser(username);
    setUserRole(role);
  };

  const handleLogout = () => {
    localStorage.removeItem('eon_active_user');
    localStorage.removeItem('eon_active_role');
    setCurrentUser(null);
  };

  const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');

  if (!currentUser) {
    return h(Auth, { onLoginSuccess: handleLoginSuccess, theme, toggleTheme });
  }

  return h(AppLayout, { user: currentUser, userRole, onLogout, theme, toggleTheme });
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
