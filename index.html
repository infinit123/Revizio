<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Finance</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='115' fill='%23007AFF'/><path d='M368 180H144c-17.7 0-32 14.3-32 32v192c0 17.7 14.3 32 32 32h224c17.7 0 32-14.3 32-32V212c0-17.7-14.3-32-32-32zm-112 144c-22.1 0-40-17.9-40-40s17.9-40 40-40 40 17.9 40 40-17.9 40-40 40z' fill='%23ffffff'/><path d='M256 108c-28 0-52 18-60 44h120c-8-26-32-44-60-44z' fill='%23ffffff'/></svg>">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    
    <!-- Header iOS -->
    <header class="ios-header">
      <div class="header-top">
        <span class="date-badge" id="current-date">Astăzi</span>
        <button class="btn-clear" id="btn-reset" title="Resetează Datele">Șterge Tot</button>
      </div>
      <h1>Finanțe</h1>
    </header>

    <!-- Navigare Stil Tab-uri Apple (4 Tab-uri) -->
    <nav class="ios-segmented-nav">
      <button class="seg-btn active" data-target="sec-dashboard">General</button>
      <button class="seg-btn" data-target="sec-goals">Obiectiv</button>
      <button class="seg-btn" data-target="sec-add">Adaugă</button>
      <button class="seg-btn" data-target="sec-history">Istoric</button>
    </nav>

    <!-- SECȚIUNEA 1: DASHBOARD / GENERAL -->
    <section id="sec-dashboard" class="tab-content active">
      <!-- Balance Card -->
      <div class="ios-card balance-card" id="balance-card">
        <span class="card-subtitle">Balanță Disponibilă</span>
        <div class="balance-value" id="balance">0,00 LEI</div>
        <div class="balance-status" id="balance-status">Buget stabil</div>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="metrics-grid">
        <div class="ios-card metric-card">
          <span class="metric-label">Venituri</span>
          <div class="metric-value color-income" id="total-income">0,00 LEI</div>
        </div>
        <div class="ios-card metric-card">
          <span class="metric-label">Cheltuieli</span>
          <div class="metric-value color-expense" id="total-expenses">0,00 LEI</div>
        </div>
      </div>

      <!-- Sumar Categorie Top -->
      <div class="ios-card">
        <h3 class="card-title">Categorii Principale</h3>
        <div class="category-breakdown" id="category-breakdown">
          <p class="empty-text">Nu există date suficiente.</p>
        </div>
      </div>
    </section>

    <!-- SECȚIUNEA 2: OBIECTIV ECONOMISIRE -->
    <section id="sec-goals" class="tab-content">
      <div class="ios-card">
        <div class="card-header-flex">
          <h2 class="card-title">Obiectiv Economisire</h2>
          <button id="btn-edit-goal" class="btn-clear">Setează</button>
        </div>
        
        <div id="goal-display">
          <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px;">
            <span id="goal-title-text" style="font-weight: 600; font-size: 17px;">Vacanță</span>
            <span id="goal-progress-text" style="font-size: 13px; color: var(--ios-text-muted); font-weight: 600;">0 / 0 LEI</span>
          </div>
          
          <div class="goal-progress-bar">
            <div id="goal-progress-fill" class="goal-progress-fill" style="width: 0%;"></div>
          </div>

          <div class="form-item" style="margin-top: 20px;">
            <label>Adaugă economii la obiectiv</label>
            <div style="display: flex; gap: 8px;">
              <input type="number" id="goal-add-amount" placeholder="Suma (ex: 100)">
              <button id="btn-add-to-goal" class="ios-btn-primary" style="margin: 0; width: auto; padding: 0 16px; white-space: nowrap;">+ Depune</button>
            </div>
          </div>
        </div>

        <!-- Formular ascuns pentru editare Obiectiv -->
        <form id="goal-form" style="display: none; margin-top: 10px;">
          <div class="form-item">
            <label>Nume Obiectiv</label>
            <input type="text" id="goal-name-input" placeholder="ex: Fond urgență, Laptop..." required>
          </div>
          <div class="form-item">
            <label>Suma Țintă (LEI)</label>
            <input type="number" id="goal-target-input" placeholder="ex: 3000" min="1" required>
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="submit" class="ios-btn-primary" style="margin: 0;">Salvează</button>
            <button type="button" id="btn-cancel-goal" class="picker-btn" style="padding: 12px;">Anulează</button>
          </div>
        </form>
      </div>
    </section>

    <!-- SECȚIUNEA 3: ADAUGĂ TRANZACȚIE -->
    <section id="sec-add" class="tab-content">
      <div class="ios-card">
        <h3 class="card-title">Tranzacție Nouă</h3>
        
        <!-- Toggle Tip -->
        <div class="type-picker">
          <button type="button" class="picker-btn active" id="pick-expense">Cheltuială</button>
          <button type="button" class="picker-btn" id="pick-income">Venit</button>
        </div>

        <form id="transaction-form">
          <input type="hidden" id="tx-type" value="expense">

          <div class="form-item">
            <label for="tx-description">Titlu</label>
            <input type="text" id="tx-description" placeholder="ex: Cumpărături, Chirie, Salariu" required autocomplete="off">
          </div>

          <div class="form-row">
            <div class="form-item">
              <label for="tx-amount">Sumă (LEI)</label>
              <input type="number" id="tx-amount" step="0.01" placeholder="0.00" required>
            </div>

            <div class="form-item">
              <label for="tx-category">Categorie</label>
              <select id="tx-category">
                <option value="Locuință & Utilități">Locuință & Utilități</option>
                <option value="Mâncare & Cumpărături">Mâncare & Cumpărături</option>
                <option value="Transport">Transport</option>
                <option value="Abonamente & Servicii">Abonamente & Servicii</option>
                <option value="Timp Liber & Ieșiri">Timp Liber & Ieșiri</option>
                <option value="Venituri & Salariu">Venituri & Salariu</option>
                <option value="Economii & Investiții">Economii & Investiții</option>
              </select>
            </div>
          </div>

          <button type="submit" class="ios-btn-primary">Salvează</button>
        </form>
      </div>
    </section>

    <!-- SECȚIUNEA 4: ISTORIC -->
    <section id="sec-history" class="tab-content">
      <div class="ios-card">
        <div class="card-header-flex">
          <h3 class="card-title">Toate Tranzacțiile</h3>
          <select id="filter-category" class="small-select">
            <option value="all">Toate Categoriile</option>
            <option value="Locuință & Utilități">Locuință & Utilități</option>
            <option value="Mâncare & Cumpărături">Mâncare & Cumpărături</option>
            <option value="Transport">Transport</option>
            <option value="Abonamente & Servicii">Abonamente & Servicii</option>
            <option value="Timp Liber & Ieșiri">Timp Liber & Ieșiri</option>
            <option value="Venituri & Salariu">Venituri & Salariu</option>
            <option value="Economii & Investiții">Economii & Investiții</option>
          </select>
        </div>
        <ul class="ios-list" id="transaction-list"></ul>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
