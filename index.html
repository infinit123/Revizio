<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Finora</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Finora">
  <meta name="theme-color" content="#F2F2F7" id="meta-theme-color">
  
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  
  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/utilities.css">
</head>
<body>
  <div id="app" class="fn-app-shell">
    <header class="fn-header" id="main-header"></header>
    <main class="fn-viewport" id="main-viewport"></main>
    <nav class="fn-navigation" id="main-navigation"></nav>
  </div>

  <div id="security-overlay" class="fn-security-overlay hidden">
    <div class="fn-security-card">
      <div class="fn-security-icon" style="font-size:48px; margin-bottom:12px;">🔒</div>
      <h2 style="font-size:20px; font-weight:700;">Finora Locked</h2>
      <p style="color:var(--fn-text-secondary); margin:8px 0 20px 0; font-size:14px;">Unlock using Face ID or Passcode</p>
      <fn-button id="btn-unlock" variant="primary" full-width>Unlock</fn-button>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
