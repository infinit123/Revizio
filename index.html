<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Life Manager</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    
    <header class="app-header">
      <h1>Finanțe</h1>
      <span class="status-tag">Personal</span>
    </header>

    <!-- Rezumat -->
    <section class="summary-grid">
      <div class="card summary-card primary-card">
        <span class="card-label">Balanță Totală</span>
        <div class="card-value" id="balance">0,00 LEI</div>
      </div>
      <div class="card summary-card">
        <span class="card-label">Venituri</span>
        <div class="card-value color-income" id="total-income">0,00 LEI</div>
      </div>
      <div class="card summary-card">
        <span class="card-label">Cheltuieli</span>
        <div class="card-value color-expense" id="total-expenses">0,00 LEI</div>
      </div>
    </section>

    <!-- Formular Adăugare -->
    <section class="card form-section">
      <h2>Adaugă Tranzacție</h2>
      
      <!-- Segmented Control stil Apple -->
      <div class="type-toggle">
        <button type="button" class="type-btn active" id="btn-expense" onclick="setType('expense')">Cheltuială</button>
        <button type="button" class="type-btn" id="btn-income" onclick="setType('income')">Venit</button>
      </div>

      <form id="transaction-form">
        <input type="hidden" id="type" value="expense">

        <div class="form-group">
          <label for="description">Descriere</label>
          <input type="text" id="description" placeholder="ex: Chirie, Salariu, Cumpărături" required autocomplete="off">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">Sumă (LEI)</label>
            <input type="number" id="amount" step="0.01" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label for="category">Categorie</label>
            <select id="category">
              <option value="Fixe">Fixe (Chirie/Rate/Utilități)</option>
              <option value="Variabile">Variabile (Mâncare/Timp Liber)</option>
              <option value="Venit">Venit (Salariu/Freelance)</option>
              <option value="Economii">Economii / Investiții</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn-primary">Adaugă</button>
      </form>
    </section>

    <!-- Lista Tranzacții -->
    <section class="card list-section">
      <h2>Istoric</h2>
      <ul id="transaction-list" class="transaction-list"></ul>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
